services:

  catalog-api:
    build:
      context: .
      dockerfile: Dockerfile.Api

    container_name: fcg-catalog-api

    ports:
      - "5002:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=catalog-sqlserver,1433;Database=FCGCatalogDb;User Id=sa;Password=${CATALOG_SQL_PASSWORD:?Defina CATALOG_SQL_PASSWORD no arquivo .env};TrustServerCertificate=True;Encrypt=False"

      ConnectionStrings__Redis: "redis:6379"
      Redis__Password: "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}"

      MongoDb__ConnectionString: "mongodb://${MONGODB_ROOT_USERNAME:-root}:${MONGODB_ROOT_PASSWORD:?Defina MONGODB_ROOT_PASSWORD no arquivo .env}@mongodb:27017/?authSource=admin"
      MongoDb__DatabaseName: "FCGCatalogReviewsDb"
      MongoDb__ReviewsCollectionName: "reviews"

      Elasticsearch__Endpoint: ${ELASTICSEARCH_ENDPOINT}
      Elasticsearch__ApiKey: ${ELASTICSEARCH_API_KEY}
      Elasticsearch__IndexName: ${ELASTICSEARCH_INDEX_NAME:-fcg-games}

      Jwt__SecretKey: "${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}"
      Jwt__Issuer: "FCG.Users.Api"
      Jwt__Audience: "FCG.CloudGames"
      Jwt__ExpirationMinutes: "180"

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: /
      RabbitMq__Username: rabbitmquser
      RabbitMq__Password: "${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}"

    depends_on:
      catalog-sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

    networks:
      - fcg-network


  catalog-worker:
    build:
      context: .
      dockerfile: Dockerfile.Worker

    container_name: fcg-catalog-worker

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=catalog-sqlserver,1433;Database=FCGCatalogDb;User Id=sa;Password=${CATALOG_SQL_PASSWORD:?Defina CATALOG_SQL_PASSWORD no arquivo .env};TrustServerCertificate=True;Encrypt=False"

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: /
      RabbitMq__Username: rabbitmquser
      RabbitMq__Password: "${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}"

    depends_on:
      catalog-sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

    networks:
      - fcg-network


  catalog-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fcg-catalog-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${CATALOG_SQL_PASSWORD:?Defina CATALOG_SQL_PASSWORD no arquivo .env}"

    ports:
      - "1436:1433"

    volumes:
      - catalog_sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'senha123@#4l' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s

    networks:
      - fcg-network


  rabbitmq:
    image: rabbitmq:3-management
    container_name: fcg-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: "rabbitmquser"
      RABBITMQ_DEFAULT_PASS: "rbmq2587!@"

    ports:
      - "5672:5672"
      - "15672:15672"

    networks:
      - fcg-network


  redis:
    image: redis:7.2-alpine
    container_name: fcg-catalog-redis

    command: redis-server --requirepass ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}

    ports:
      - "6379:6379"

    volumes:
      - catalog_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      - fcg-network


  mongodb:
    image: mongo:7
    container_name: fcg-catalog-mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: mongouser
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_ROOT_PASSWORD:?Defina MONGODB_ROOT_PASSWORD no arquivo .env}"

    ports:
      - "27017:27017"

    volumes:
      - catalog_mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "mongouser",
          "--password",
          "${MONGODB_ROOT_PASSWORD:?Defina MONGODB_ROOT_PASSWORD no arquivo .env}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.runCommand({ ping: 1 })"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - fcg-network


  kong-database:
    image: postgres:11.16
    container_name: fcg-kong-database

    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: "${KONG_DB_PASSWORD:?Defina KONG_DB_PASSWORD no arquivo .env}"
      POSTGRES_DB: kong

    volumes:
      - kong_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - fcg-network


  kong-migrations:
    image: kong:3.4
    container_name: fcg-kong-migrations

    command: kong migrations bootstrap

    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: "${KONG_DB_PASSWORD:?Defina KONG_DB_PASSWORD no arquivo .env}"

    depends_on:
      kong-database:
        condition: service_healthy

    restart: on-failure

    networks:
      - fcg-network


  kong:
    image: kong:3.4
    container_name: fcg-kong

    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: "${KONG_DB_PASSWORD:?Defina KONG_DB_PASSWORD no arquivo .env}"

      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      KONG_ADMIN_LISTEN: "0.0.0.0:8001"

    ports:
      - "8000:8000"
      - "8001:8001"

    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully

    networks:
      - fcg-network


  konga-database:
    image: postgres:11.16
    container_name: fcg-konga-database

    environment:
      POSTGRES_USER: konga
      POSTGRES_PASSWORD: "${KONG_DB_PASSWORD:?Defina KONG_DB_PASSWORD no arquivo .env}"
      POSTGRES_DB: konga

    volumes:
      - konga_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konga -d konga"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - fcg-network


  konga-prepare:
    image: pantsel/konga:latest
    container_name: fcg-konga-prepare

    command: >
      -c prepare
      -a postgres
      -u postgresql://konga:konga@konga-database:5432/konga

    depends_on:
      konga-database:
        condition: service_healthy

    restart: on-failure

    networks:
      - fcg-network


  konga:
    image: pantsel/konga:latest
    container_name: fcg-konga

    environment:
      TOKEN_SECRET: "${KONGA_TOKEN_SECRET:?Defina KONGA_TOKEN_SECRET no arquivo .env}"
      DB_ADAPTER: postgres
      DB_HOST: konga-database
      DB_PORT: "5432"
      DB_USER: konga
      DB_PASSWORD: "${KONG_DB_PASSWORD:?Defina KONG_DB_PASSWORD no arquivo .env}"
      DB_DATABASE: konga
      NODE_ENV: production

    ports:
      - "1337:1337"

    depends_on:
      konga-database:
        condition: service_healthy
      konga-prepare:
        condition: service_completed_successfully
      kong:
        condition: service_started

    networks:
      - fcg-network


volumes:
  catalog_sqlserver_data:
  catalog_redis_data:
  catalog_mongodb_data:
  kong_data:
  konga_data:


networks:
  fcg-network:
    driver: bridge
